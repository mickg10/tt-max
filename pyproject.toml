[project]
name = "tt-max"
version = "0.1.0"
description = "Bounded CPU, memory and Tenstorrent stress runs with a live dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "psutil>=6,<8"]

[project.scripts]
tt-max = "tt_max.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt_max"]

[dependency-groups]
dev = ["pytest>=8,<10"]
